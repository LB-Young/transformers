<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#23272f; --sub:#66707b; --line:#e5e4df;
    --accent:#1d4ed8; --accent-ink:#1e40af; --accent-soft:#e2eafb; --accent-line:#c0d0f4;
    --node:#fffdf9; --edge:#c9c4ba; --mono:#3b5390;
    --t2:#0e7490; --t2-ink:#155e75; --t2-soft:#e0f2f7; --t2-line:#a5d8e6;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; line-height:1.65; font-size:15px;}
  .wrap{max-width:1220px; margin:0 auto; padding:0 16px;}
  code,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; font-size:.92em;}
  .num{color:var(--mono); background:var(--accent-soft); padding:0 4px; border-radius:4px; white-space:nowrap;}
  a{color:var(--accent-ink);}

  nav.top{position:sticky; top:0; z-index:50; background:rgba(250,249,246,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  nav.top .wrap{display:flex; align-items:center; gap:14px; padding-top:10px; padding-bottom:10px; overflow-x:auto; white-space:nowrap;}
  nav.top .brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--accent-ink);}
  nav.top .brand svg{flex:none;}
  nav.top a.link{color:var(--ink); text-decoration:none; font-size:.9rem; padding:6px 10px; border-radius:8px;}
  nav.top a.link:hover{background:var(--accent-soft); color:var(--accent-ink);}

  header.hero{padding:36px 0 8px;}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .badge{font-size:.78rem; padding:3px 10px; border-radius:999px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-ink);}
  .badge.t2{border-color:var(--t2-line); background:var(--t2-soft); color:var(--t2-ink);}
  h1{font-size:clamp(1.6rem,4vw,2.3rem); letter-spacing:.5px;}
  .lead{color:var(--sub); max-width:1000px; margin-top:8px;}
  .lead b{color:var(--ink);}

  section{margin:36px 0;}
  h2{font-size:1.35rem; display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  h2 .secno{font-size:.85rem; color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent-line); width:28px; height:28px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  h3{font-size:1.02rem; margin:14px 0 6px;}
  .note{font-size:.85rem; color:var(--sub);}
  .tip{font-size:.82rem; color:var(--sub); background:var(--accent-soft); border:1px dashed var(--accent-line); padding:8px 12px; border-radius:10px; margin-top:8px;}

  .diagram-shell{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; overflow-x:auto; margin-top:10px;}
  .diagram-shell svg{display:block; min-width:880px; width:100%; height:auto;}
  .dg{font-family:system-ui,"Microsoft YaHei",sans-serif;}
  .dg .node rect{fill:var(--node); stroke:var(--edge); stroke-width:1.3;}
  .dg .node.dim rect{fill:var(--accent-soft); stroke:var(--accent-line);}
  .dg .node.core rect{fill:#eef3fd; stroke:var(--accent); stroke-width:1.6;}
  .dg .node.t2 rect{fill:var(--t2-soft); stroke:var(--t2); stroke-width:1.6;}
  .dg .node text{font-size:12.5px; fill:var(--ink);}
  .dg .node text.t{font-weight:700; font-size:13px;}
  .dg .node text.s{fill:var(--sub); font-size:11px;}
  .dg .node text.m{fill:var(--mono); font-family:ui-monospace,Consolas,monospace; font-size:11px;}
  .dg .edge{stroke:var(--edge); stroke-width:1.6; fill:none; marker-end:url(#arr);}
  .dg .edge.faint{stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 4;}
  .dg .lg{font-size:11px; fill:var(--sub);}

  .ts{overflow-x:auto; border-radius:var(--radius); margin-top:8px;}
  table.cmp{width:100%; min-width:860px; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table.cmp th{background:var(--accent-soft); color:var(--accent-ink); font-size:.85rem; text-align:left; padding:8px 12px; border-bottom:1px solid var(--accent-line);}
  table.cmp td{padding:8px 12px; font-size:.9rem; border-bottom:1px solid var(--line); vertical-align:top;}
  table.cmp tr:last-child td{border-bottom:none;}
  table.cmp td.f{font-weight:700; white-space:nowrap;}
  table.cmp td.m{font-family:ui-monospace,Consolas,monospace; font-size:.85rem; color:var(--mono); white-space:nowrap;}

  pre.code{background:#f4f4f7; border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow-x:auto; font-size:.85rem; line-height:1.55; margin-top:8px;}
  pre.code code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr;} }

  footer{margin:48px 0 20px; color:var(--sub); font-size:.8rem; border-top:1px solid var(--line); padding-top:14px;}

body{margin:0; background:#ffffff;}
.diagram-shell{padding:14px; border:1px solid #e5e4df; border-radius:12px; width:1000.0px;}
.diagram-shell svg{display:block; width:1000.0px; height:320.0px; min-width:0;}
</style>
</head>
<body><div class="diagram-shell"><svg class="dg" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c9c4ba"/></marker>

    <g class="node"><rect x="150" y="16" width="130" height="92" rx="8"/><text x="215" y="44" text-anchor="middle" class="t">Patch 化</text><text x="215" y="62" text-anchor="middle" class="s">32×32 → 49 patch</text><text x="215" y="80" text-anchor="middle" class="s">+ CLS = 50 token</text><text x="215" y="96" text-anchor="middle" class="m">quick_gelu</text></g>
    <g class="node core"><rect x="304" y="16" width="150" height="92" rx="10"/><text x="379" y="44" text-anchor="middle" class="t">视觉塔 ViT</text><text x="379" y="62" text-anchor="middle" class="s">12L / 768 / 12H</text><text x="379" y="80" text-anchor="middle" class="s">双向自注意力</text><text x="379" y="96" text-anchor="middle" class="m">池化取 [CLS]</text></g>
    <g class="node t2"><rect x="478" y="30" width="110" height="64" rx="8"/><text x="533" y="56" text-anchor="middle" class="t">视觉投影</text><text x="533" y="74" text-anchor="middle" class="m">768 → 512</text></g>
    <!-- 文本侧 -->
    <g class="node dim"><rect x="16" y="214" width="110" height="64" rx="8"/><text x="71" y="240" text-anchor="middle" class="t">文本 T</text><text x="71" y="258" text-anchor="middle" class="s">≤77 token</text></g>
    <g class="node"><rect x="150" y="200" width="130" height="92" rx="8"/><text x="215" y="228" text-anchor="middle" class="t">BPE 分词</text><text x="215" y="246" text-anchor="middle" class="s">49408 词表</text><text x="215" y="264" text-anchor="middle" class="s">+ 位置编码</text><text x="215" y="280" text-anchor="middle" class="m">bos 49406</text></g>
    <g class="node core"><rect x="304" y="200" width="150" height="92" rx="10"/><text x="379" y="228" text-anchor="middle" class="t">文本塔</text><text x="379" y="246" text-anchor="middle" class="s">12L / 512 / 8H</text><text x="379" y="264" text-anchor="middle" class="s">因果掩码（GPT-2 式）</text><text x="379" y="280" text-anchor="middle" class="m">池化取 [EOS]</text></g>
    <g class="node t2"><rect x="478" y="214" width="110" height="64" rx="8"/><text x="533" y="240" text-anchor="middle" class="t">文本投影</text><text x="533" y="258" text-anchor="middle" class="m">512 → 512</text></g>
    <!-- 公共空间 -->
    <g class="node core"><rect x="626" y="98" width="150" height="126" rx="10"/><text x="701" y="126" text-anchor="middle" class="t">公共空间</text><text x="701" y="146" text-anchor="middle" class="s">L2 归一化</text><text x="701" y="164" text-anchor="middle" class="m">余弦相似度矩阵</text><text x="701" y="182" text-anchor="middle" class="m">× logit_scale</text><text x="701" y="200" text-anchor="middle" class="s">logit_scale 可学习</text></g>
    <g class="node t2"><rect x="810" y="118" width="170" height="88" rx="10"/><text x="895" y="148" text-anchor="middle" class="t">InfoNCE 对比损失</text><text x="895" y="166" text-anchor="middle" class="s">拉近 (I_i, T_i) 正对</text><text x="895" y="184" text-anchor="middle" class="s">推远 batch 内负对</text><text x="895" y="202" text-anchor="middle" class="m">对称（图↔文）</text></g>
    <path class="edge" d="M126,62 L148,62"/>
    <path class="edge" d="M280,62 L302,62"/>
    <path class="edge" d="M454,62 L476,62"/>
    <path class="edge" d="M588,62 L624,118"/>
    <path class="edge" d="M126,246 L148,246"/>
    <path class="edge" d="M280,246 L302,246"/>
    <path class="edge" d="M454,246 L476,246"/>
    <path class="edge" d="M588,246 L624,204"/>
    <path class="edge" d="M776,160 L808,160"/>
  </svg></div></body>
</html>
