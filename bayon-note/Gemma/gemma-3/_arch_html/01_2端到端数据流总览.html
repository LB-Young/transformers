<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#23272f; --sub:#66707b; --line:#e5e4df;
    --accent:#1d4ed8; --accent-ink:#1e40af; --accent-soft:#e2eafb; --accent-line:#c0d0f4;
    --node:#fffdf9; --edge:#c9c4ba; --mono:#3b5390;
    --sliding:#dbe7fc; --sliding-edge:#a9c2f3; --full:#1d4ed8;
    --mm:#0e7490; --mm-ink:#155e75; --mm-soft:#e0f2f7; --mm-line:#a5d8e6;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; line-height:1.65; font-size:15px;}
  .wrap{max-width:1220px; margin:0 auto; padding:0 16px;}
  code,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; font-size:.92em;}
  .num{color:var(--mono); background:var(--accent-soft); padding:0 4px; border-radius:4px; white-space:nowrap;}
  .num.mm{color:var(--mm-ink); background:var(--mm-soft);}
  sup.src{color:var(--accent-ink); font-size:.72em; font-weight:700; cursor:help; white-space:nowrap;}
  a{color:var(--accent-ink);}

  nav.top{position:sticky; top:0; z-index:50; background:rgba(250,249,246,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  nav.top .wrap{display:flex; align-items:center; gap:14px; padding-top:10px; padding-bottom:10px; overflow-x:auto; white-space:nowrap;}
  nav.top .brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--accent-ink);}
  nav.top .brand svg{flex:none;}
  nav.top a.link{color:var(--ink); text-decoration:none; font-size:.9rem; padding:6px 10px; border-radius:8px;}
  nav.top a.link:hover{background:var(--accent-soft); color:var(--accent-ink);}
  nav.top a.link.mm-link{color:var(--mm-ink);}
  nav.top a.link.mm-link:hover{background:var(--mm-soft);}

  header.hero{padding:36px 0 8px;}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .badge{font-size:.78rem; padding:3px 10px; border-radius:999px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-ink);}
  .badge.mm{background:var(--mm-soft); border-color:var(--mm-line); color:var(--mm-ink);}
  h1{font-size:clamp(1.6rem,4vw,2.3rem); letter-spacing:.5px;}
  .lead{color:var(--sub); max-width:1000px; margin-top:8px;}
  .lead b{color:var(--ink);}

  section{margin:36px 0;}
  h2{font-size:1.35rem; display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  h2 .secno{font-size:.85rem; color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent-line); width:28px; height:28px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  h2.mm .secno{color:var(--mm-ink); background:var(--mm-soft); border-color:var(--mm-line);}
  h3{font-size:1.02rem; margin:12px 0 6px;}
  .note{font-size:.85rem; color:var(--sub);}
  .tip{font-size:.82rem; color:var(--sub); background:var(--accent-soft); border:1px dashed var(--accent-line); padding:8px 12px; border-radius:10px; margin-top:8px;}
  .tip.mm{background:var(--mm-soft); border-color:var(--mm-line); color:var(--mm-ink);}

  .diagram-shell{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; overflow-x:auto;}
  .diagram-shell svg{display:block; min-width:900px; width:100%; height:auto;}
  .dg{font-family:system-ui,"Microsoft YaHei",sans-serif;}
  .dg .node rect{fill:var(--node); stroke:var(--edge); stroke-width:1.3;}
  .dg .node.dim rect{fill:var(--accent-soft); stroke:var(--accent-line);}
  .dg .node.core rect{fill:#eef3fd; stroke:var(--accent); stroke-width:1.6;}
  .dg .node.mm rect{fill:var(--mm-soft); stroke:var(--mm); stroke-width:1.6;}
  .dg .node.text rect{fill:#f4f4f2; stroke:var(--edge); stroke-dasharray:4 3;}
  .dg .node text{font-size:12.5px; fill:var(--ink);}
  .dg .node text.t{font-weight:700; font-size:13px;}
  .dg .node text.s{fill:var(--sub); font-size:11px;}
  .dg .node text.m{fill:var(--mono); font-family:ui-monospace,Consolas,monospace; font-size:11px;}
  .dg .node.mm text.t{fill:var(--mm-ink);}
  .dg .edge{stroke:var(--edge); stroke-width:1.6; fill:none; marker-end:url(#arr);}
  .dg .edge.mm{stroke:var(--mm); stroke-width:1.8; marker-end:url(#arrm);}
  .dg .edge.faint{stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 4;}
  .dg .lg{font-size:11px; fill:var(--sub);}
  .dg .lgb{font-size:11.5px; fill:var(--accent-ink); font-weight:600;}
  .dg .lgm{font-size:11.5px; fill:var(--mm-ink); font-weight:600;}

  table.cmp{width:100%; min-width:860px; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; table-layout:fixed;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.cmp th,table.cmp td{padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:.8rem; word-wrap:break-word;}
  table.cmp thead th{background:var(--accent-soft); color:var(--accent-ink); font-weight:700; font-size:.84rem;}
  table.cmp thead th.mm-th{background:var(--mm-soft); color:var(--mm-ink);}
  table.cmp tbody tr:nth-child(even){background:#f5f8ff;}
  table.cmp td.k{font-weight:600;}
  table.cmp td small{color:var(--sub); display:block; margin-top:2px;}
  table.cmp col.c1{width:18%;}
  table.cmp col.cx{width:16.4%;}
  table.cmp tr.hl td{background:#eaf1fe;}

  .cards{display:grid; grid-template-columns:minmax(0,1fr); gap:14px;}
  @media (min-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; min-width:0; overflow-wrap:anywhere;}
  .card h3{display:flex; align-items:center; gap:8px; margin-top:0; font-size:.98rem;}
  .card p{font-size:.88rem; margin-top:6px;}
  .card .meta{margin-top:8px; font-size:.78rem; color:var(--sub);}
  .formula{background:#1f2937; color:#bfd3ff; font-family:ui-monospace,Consolas,monospace; font-size:.82rem; padding:10px 14px; border-radius:8px; margin-top:8px; overflow-x:auto; white-space:pre; line-height:1.6; max-width:100%;}
  .formula.mm{background:#134e4a; color:#c7f0e8;}
  .formula .cm{color:#8b93a7;}

  ol.src{list-style:none; counter-reset:s; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  ol.src li{counter-increment:s; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.86rem;}
  ol.src li:last-child{border-bottom:none;}
  ol.src li::before{content:"[" counter(s) "] "; color:var(--accent-ink); font-weight:700; font-family:ui-monospace,Consolas,monospace;}
  ol.src .u{display:block; color:var(--sub); word-break:break-all; font-size:.78rem;}

  footer{margin:44px 0 24px; color:var(--sub); font-size:.8rem; text-align:center;}
  #tip{position:fixed; z-index:99; display:none; max-width:360px; background:#23272f; color:#fff; padding:10px 12px; border-radius:10px; font-size:.82rem; line-height:1.5; white-space:pre-line; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  #tip b{color:#bfd3ff;}
  #tip b.m{color:#99e9dc;}

  @media print{
    nav.top{display:none;}
    body{background:#fff; font-size:12px;}
    .diagram-shell{overflow:visible; border:none; padding:0;}
    .diagram-shell svg{min-width:0;}
    section{page-break-inside:avoid;}
    .cards{display:block;}
    .card{margin-bottom:10px;}
  }
</style></head><body style="margin:0;padding:0;background:#ffffff;"><svg viewBox="0 0 1280 760" class="dg" role="img">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9c4ba"/></marker>
      <marker id="arrm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7490"/></marker>
    </defs>

    <!-- 输入列 -->
    <g class="node text" data-tip="文本输入 input_ids&#10;与图像占位 token(image_token_index=262144) 交错拼接&#10;来源：modeling_gemma3.py:856-861, 864, 876">
      <rect x="16" y="330" width="120" height="60" rx="12"/>
      <text class="t" x="76" y="356" text-anchor="middle">文本 token</text>
      <text class="s" x="76" y="374" text-anchor="middle">input_ids</text>
    </g>
    <g class="node mm" data-tip="图像输入 pixel_values&#10;896×896 归一化像素；仅 4B/12B/27B&#10;270M/1B 无此路（Gemma3TextModel input_modalities=text，:476）&#10;来源：modeling_gemma3.py:779-781">
      <rect x="16" y="90" width="120" height="60" rx="12"/>
      <text class="t" x="76" y="116" text-anchor="middle">图像像素</text>
      <text class="s" x="76" y="134" text-anchor="middle">896×896</text>
    </g>

    <!-- 视觉塔 -->
    <g class="node mm" data-tip="视觉塔 SigLIPVisionModel（仅 4B/12B/27B）&#10;hidden=1152, 27 层, 16 头, head_dim 72, inter 4304&#10;patch 14, image 896 → 64×64=4096 patches&#10;PatchEmbedder: Linear(3·14²=588→1152)&#10;双向 Transformer（SigLIP 初始化，vision_use_head=false，convert_gemma3_weights.py:123）&#10;来源：modeling_gemma3.py:768">
      <rect x="196" y="60" width="240" height="150" rx="12"/>
      <text class="t" x="316" y="86" text-anchor="middle">SigLIP 视觉塔</text>
      <text class="m" x="316" y="110" text-anchor="middle">patch embed 14×14</text>
      <text class="m" x="316" y="128" text-anchor="middle">双向 ViT ×27（hidden 1152）</text>
      <text class="m" x="316" y="146" text-anchor="middle">64×64 = 4096 patch</text>
      <text class="s" x="316" y="172" text-anchor="middle">270M/1B 无此塔</text>
      <text class="s" x="316" y="190" text-anchor="middle">三支大尺寸共用同一支</text>
    </g>
    <path class="edge mm" d="M136,120 L196,120"/>

    <!-- projector -->
    <g class="node mm" data-tip="Gemma3MultiModalProjector（650-683）&#10;reshape 成 (B,1152,64,64)&#10;AvgPool2d kernel=4 stride=4 → 16×16（:665,676）&#10;flatten = 256 tokens/图（:677-678）&#10;再 RMSNorm(1152)（:680）→ Linear matmul（:682）&#10;mm_input_projection_weight 初始化为 0（:654-656）&#10;来源：modeling_gemma3.py:667-683">
      <rect x="196" y="240" width="240" height="110" rx="12"/>
      <text class="t" x="316" y="266" text-anchor="middle">投影器（AvgPool）</text>
      <text class="m" x="316" y="288" text-anchor="middle">64×64 → 16×16（kernel 4）</text>
      <text class="m" x="316" y="306" text-anchor="middle">Pool/Flatten → RMSNorm → Linear</text>
      <text class="s" x="316" y="328" text-anchor="middle">256 tokens/图，tokens_per_side=16</text>
    </g>
    <path class="edge mm" d="M316,210 L316,240"/>

    <!-- embedding：先 token 嵌入（:864） -->
    <g class="node dim" data-tip="输入嵌入 Gemma3TextScaledWordEmbedding&#10;先把文本/占位 token 嵌入为 inputs_embeds（modeling_gemma3.py:864）&#10;Embedding(V, d_model)，输出 × √d_model（:115-116,484-486）&#10;（270M √640≈25.3；4B √2560≈50.6；27B √5376≈73.3）&#10;与 lm_head 共享权重（tie，:922）&#10;来源：modeling_gemma3.py:105-116, 484-486, 864">
      <rect x="478" y="232" width="150" height="96" rx="12"/>
      <text class="t" x="553" y="262" text-anchor="middle">Embedding</text>
      <text class="m" x="553" y="284" text-anchor="middle">V × d_model × √d</text>
      <text class="s" x="553" y="304" text-anchor="middle">inputs_embeds · tied</text>
    </g>
    <path class="edge" d="M136,360 L146,430 L466,430 L466,280 L478,280"/>

    <!-- 融合：嵌入之后再 masked_scatter 视觉特征（:876） -->
    <g class="node dim" data-tip="序列融合 masked_scatter（在 Embedding 之后）&#10;先把 OOV 图像占位 id(262144) 替换为 pad=0（:856-859）&#10;再用 special_image_mask 把投影视觉特征 scatter 进 inputs_embeds 对应位置（:873-876）&#10;与文本 embedding 拼成统一 hidden 序列后送入 language_model（:897-905）&#10;来源：modeling_gemma3.py:856-861, 864, 876; get_placeholder_mask :785-807">
      <rect x="660" y="222" width="120" height="110" rx="12"/>
      <text class="t" x="720" y="260" text-anchor="middle">masked_</text>
      <text class="t" x="720" y="280" text-anchor="middle">scatter</text>
      <text class="s" x="720" y="304" text-anchor="middle">统一 hidden 序列</text>
    </g>
    <path class="edge" d="M628,280 L660,280"/>
    <path class="edge mm" d="M436,285 C540,195 660,185 720,185 L720,222"/>

    <!-- 解码层堆 -->
    <g class="node core" data-tip="解码层 × N（sliding 与 full 5:1 交错）&#10;270M 18 层 / 1B 26 / 4B 34 / 12B 48 / 27B 62&#10;每 6 层第 6 层为 full，其余 sliding&#10;每层 = RMSNorm→Attn(双 RoPE/GQA)→RMSNorm→⊕&#10;      + RMSNorm→GeGLU→RMSNorm→⊕&#10;来源：config layer_types；modeling_gemma3.py:375-418">
      <rect x="812" y="120" width="250" height="480" rx="14"/>
      <text class="t" x="937" y="148" text-anchor="middle">解码层 × N（sliding ‖ full）</text>
      <text class="s" x="937" y="168" text-anchor="middle">18 / 26 / 34 / 48 / 62 层</text>
      <text class="s" x="830" y="196">full 层：每 6 层 1 个；其余 sliding（窗 512/1024）</text>
      <rect x="830" y="206" width="8" height="14" rx="2" fill="#dbe7fc" stroke="#a9c2f3"/>
      <text class="s" x="844" y="218">= sliding（θ=1e4，滑窗）</text>
      <rect x="830" y="228" width="8" height="14" rx="2" fill="#1d4ed8" stroke="#1d4ed8"/>
      <text class="s" x="844" y="240">= full（θ=1e6，全因果）</text>
      <g class="node" data-tip="层内子结构（详见 §3/§4）&#10;① input_layernorm → 注意力 → post_attn_layernorm → ⊕&#10;② pre_ff_layernorm → GeGLU → post_ff_layernorm → ⊕&#10;注意力含 Q/K/V/O、QK-Norm、双 RoPE、GQA&#10;来源：modeling_gemma3.py:383-416">
        <rect x="830" y="262" width="214" height="180" rx="10"/>
        <text class="t" x="937" y="288" text-anchor="middle">每层结构</text>
        <text class="s" x="937" y="312" text-anchor="middle">RMSNorm → 注意力 → ⊕</text>
        <text class="s" x="937" y="336" text-anchor="middle">RMSNorm → GeGLU → ⊕</text>
        <text class="m" x="937" y="362" text-anchor="middle">QK-Norm · 双 RoPE · GQA</text>
        <text class="m" x="937" y="384" text-anchor="middle">gelu_pytorch_tanh</text>
        <text class="s" x="937" y="410" text-anchor="middle">无 softcap / 无 layer_scalar</text>
      </g>
      <g class="node mm" data-tip="图像 token 的双向注意力（多模态模型）&#10;token_type_ids 标记图像块：块内图像 token 双向、&#10;不看未来图像；full=OR(causal,blockwise)&#10;sliding=AND(滑窗,OR(causal,blockwise))&#10;来源：modeling_gemma3.py:686-754, 888-893">
        <rect x="830" y="458" width="214" height="110" rx="10"/>
        <text class="t" x="937" y="482" text-anchor="middle">图像块双向掩码</text>
        <text class="m" x="937" y="504" text-anchor="middle">blockwise overlay</text>
        <text class="s" x="937" y="526" text-anchor="middle">仅多模态模型启用</text>
        <text class="s" x="937" y="546" text-anchor="middle">纯文本 270M/1B 标准因果</text>
      </g>
    </g>
    <path class="edge" d="M780,277 L812,277"/>

    <!-- final norm -->
    <g class="node dim" data-tip="最终 RMSNorm（全部层后）&#10;Gemma3RMSNorm：fp32 归一，×(1+γ)，γ 初始化 0（零中心）&#10;eps=1e-6&#10;来源：modeling_gemma3.py:135-149, 490">
      <rect x="1090" y="250" width="84" height="100" rx="12"/>
      <text class="t" x="1132" y="286" text-anchor="middle">最终</text>
      <text class="t" x="1132" y="306" text-anchor="middle">RMSNorm</text>
      <text class="s" x="1132" y="330" text-anchor="middle">eps 1e-6</text>
    </g>
    <path class="edge" d="M1062,300 L1090,300"/>

    <!-- lm head -->
    <g class="node dim" data-tip="LM Head（共享权重，无 bias，:928,922）&#10;d_model → vocab 维（ForCG 在 :1014 直接线性投影，无 softcap 分支）&#10;Gemma 3 无 final soft-capping（final_logit_softcapping=null，configuration_gemma3.py:96）&#10;对比 Gemma 2：tanh(logits/cap)×cap 已不启用（:632-635 仅在非 null 时执行）&#10;来源：modeling_gemma3.py:1014, 632-635; configuration_gemma3.py:96">
      <rect x="1196" y="230" width="70" height="140" rx="12"/>
      <text class="t" x="1231" y="266" text-anchor="middle">LM</text>
      <text class="t" x="1231" y="286" text-anchor="middle">Head</text>
      <text class="m" x="1231" y="310" text-anchor="middle">×tied</text>
      <text class="m" x="1231" y="332" text-anchor="middle">无</text>
      <text class="m" x="1231" y="350" text-anchor="middle">softcap</text>
    </g>
    <path class="edge" d="M1174,300 L1196,300"/>
    <text class="s" x="1231" y="390" text-anchor="middle">下一 token</text>
    <text class="s" x="1231" y="408" text-anchor="middle">分布</text>

    <text class="lgb" x="620" y="500">主干：文本 token 流（五尺寸共用）</text>
    <text class="lgm" x="620" y="520">视觉路径仅 4B/12B/27B</text>
  </svg></body></html>
