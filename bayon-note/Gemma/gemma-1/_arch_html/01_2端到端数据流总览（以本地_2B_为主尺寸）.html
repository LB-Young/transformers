<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#23272f; --sub:#66707b; --line:#e5e4df;
    --accent:#b45309; --accent-ink:#7c3a0a; --accent-soft:#f7ead6; --accent-line:#e8cfae;
    --node:#fffdf9; --edge:#c9c4ba; --mono:#7a5a2e;
    --kv:#0f766e; --kv-soft:#dcf3ef; --kv-line:#9fd4cc;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; line-height:1.66; font-size:15px;}
  .wrap{max-width:1200px; margin:0 auto; padding:0 16px;}
  code,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; font-size:.92em;}
  .num{color:var(--mono); background:var(--accent-soft); padding:0 4px; border-radius:4px; white-space:nowrap;}
  .num.kv{color:var(--kv); background:var(--kv-soft);}
  sup.src{color:var(--accent-ink); font-size:.72em; font-weight:700; cursor:help; white-space:nowrap;}
  a{color:var(--accent-ink);}

  nav.top{position:sticky; top:0; z-index:50; background:rgba(250,249,246,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  nav.top .wrap{display:flex; align-items:center; gap:10px; padding-top:10px; padding-bottom:10px; overflow-x:auto; white-space:nowrap;}
  nav.top .brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--accent-ink); flex:none;}
  nav.top a.link{color:var(--ink); text-decoration:none; font-size:.88rem; padding:6px 10px; border-radius:8px;}
  nav.top a.link:hover{background:var(--accent-soft); color:var(--accent-ink);}

  header.hero{padding:36px 0 6px;}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .badge{font-size:.78rem; padding:3px 10px; border-radius:999px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-ink);}
  .badge.teal{border-color:var(--kv-line); background:var(--kv-soft); color:var(--kv);}
  h1{font-size:clamp(1.6rem,4vw,2.3rem); letter-spacing:.5px;}
  .lead{color:var(--sub); max-width:980px; margin-top:10px;}
  .lead b{color:var(--ink);}

  section{margin:34px 0;}
  h2{font-size:1.32rem; display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  h2 .secno{font-size:.82rem; color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent-line); width:28px; height:28px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  h3{font-size:1.02rem; margin:14px 0 6px;}
  .note{font-size:.86rem; color:var(--sub);}
  .tip{font-size:.83rem; color:var(--sub); background:var(--accent-soft); border:1px dashed var(--accent-line); padding:9px 13px; border-radius:10px; margin-top:10px;}
  .tip.warn{background:#fdecec; border-color:#e6b3b3; color:#8a3b3b;}
  .tip.teal{background:var(--kv-soft); border-color:var(--kv-line); color:var(--kv);}

  .diagram-shell{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; overflow-x:auto;}
  .diagram-shell svg{display:block; min-width:880px; width:100%; height:auto;}
  .dg{font-family:system-ui,"Microsoft YaHei",sans-serif;}
  .dg .node rect{fill:var(--node); stroke:var(--edge); stroke-width:1.3;}
  .dg .node.dim rect{fill:var(--accent-soft); stroke:var(--accent-line);}
  .dg .node.core rect{fill:#fdf3e3; stroke:var(--accent); stroke-width:1.6;}
  .dg .node.kv rect{fill:var(--kv-soft); stroke:var(--kv); stroke-width:1.4;}
  .dg .node text{font-size:12.5px; fill:var(--ink);}
  .dg .node text.t{font-weight:700; font-size:13px;}
  .dg .node text.s{fill:var(--sub); font-size:11px;}
  .dg .node text.m{fill:var(--mono); font-family:ui-monospace,Consolas,monospace; font-size:11px;}
  .dg .edge{stroke:var(--edge); stroke-width:1.6; fill:none; marker-end:url(#arr);}
  .dg .edge.rm{stroke:var(--accent); stroke-width:1.6; fill:none; stroke-dasharray:6 4; marker-end:url(#arrA);}
  .dg .edge.kve{stroke:var(--kv); stroke-width:1.7; fill:none; marker-end:url(#arrK);}
  .dg .edge.faint{stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 4; fill:none;}
  .dg text.lbl{font-size:11px; fill:var(--sub);}
  .dg text.lblK{font-size:11px; fill:var(--kv); font-weight:600;}

  table.cmp{width:100%; min-width:760px; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; table-layout:fixed;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.cmp th,table.cmp td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:.82rem; word-wrap:break-word;}
  table.cmp thead th{background:var(--accent-soft); color:var(--accent-ink); font-weight:700; font-size:.86rem;}
  table.cmp thead th.kv-th{background:var(--kv-soft); color:var(--kv);}
  table.cmp tbody tr:nth-child(even){background:#fdfbf7;}
  table.cmp tbody tr:last-child td{border-bottom:none;}
  table.cmp td.k{font-weight:600;}
  table.cmp td small{color:var(--sub); display:block; margin-top:2px;}
  table.cmp tr.hl td{background:#fdf3e3;}
  table.cmp td.kv-td{background:var(--kv-soft);}
  table.cmp code{color:var(--accent-ink);}

  .cards{display:grid; grid-template-columns:1fr; gap:14px;}
  @media (min-width:820px){.cards{grid-template-columns:repeat(2,1fr);}}
  .cards > *{min-width:0;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; min-width:0;}
  .card.kv{background:var(--kv-soft); border-color:var(--kv-line);}
  .card h3{display:flex; align-items:center; gap:8px; margin-top:0; font-size:.98rem;}
  .card.kv h3{color:var(--kv);}
  .card p{font-size:.88rem; margin-top:6px;}
  .card .meta{margin-top:9px; font-size:.8rem; color:var(--sub);}
  .formula{background:#2b2218; color:#f0d9b5; font-family:ui-monospace,Consolas,monospace; font-size:.82rem; padding:10px 14px; border-radius:8px; margin-top:8px; overflow-x:auto; white-space:pre; line-height:1.6;}
  .formula .cm{color:#9a8a70;}

  ol.src{list-style:none; counter-reset:s; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  ol.src li{counter-increment:s; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.85rem;}
  ol.src li:last-child{border-bottom:none;}
  ol.src li::before{content:"[" counter(s) "] "; color:var(--accent-ink); font-weight:700; font-family:ui-monospace,Consolas,monospace;}
  ol.src .u{display:block; color:var(--sub); word-break:break-all; font-size:.78rem; margin-top:2px;}

  footer{margin:40px 0 24px; color:var(--sub); font-size:.8rem; text-align:center;}
  #tip{position:fixed; z-index:99; display:none; max-width:360px; background:#23272f; color:#fff; padding:10px 12px; border-radius:10px; font-size:.82rem; line-height:1.5; white-space:pre-line; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  #tip b{color:#f0c384;}

  @media print{
    nav.top{display:none;}
    body{background:#fff; font-size:12px;}
    .diagram-shell{overflow:visible; border:none; padding:0;}
    .diagram-shell svg{min-width:0;}
    section{page-break-inside:avoid;}
    .cards{display:block;}
    .card{margin-bottom:10px;}
    table.cmp{min-width:0;}
  }
</style></head><body style="margin:0;padding:0;background:#ffffff;"><svg viewBox="0 0 1240 200" class="dg" role="img">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9c4ba"/></marker>
    </defs>

    <g class="node core"><rect x="16" y="66" width="120" height="66" rx="12"/>
      <text class="t" x="76" y="92" text-anchor="middle">input_ids</text>
      <text class="m" x="76" y="112" text-anchor="middle">(b, s)</text></g>
    <path class="edge" d="M136,99 L176,99"/>

    <g class="node dim" data-tip="GemmaTextScaledWordEmbedding（:49-60, :362-363）&#10;Embedding(256000, 2048)，padding_idx=0&#10;前向再乘 embed_scale = √2048 ≈ 45.25&#10;（7B 为 √3072 ≈ 55.43）&#10;这是 Gemma 区别于 LLaMA 的细节：嵌入整体缩放。">
      <rect x="176" y="52" width="186" height="94" rx="12"/>

      <text class="s" x="269" y="134" text-anchor="middle">(b,s,2048) · ScaledWordEmbedding</text></g>
    <path class="edge" d="M362,99 L398,99"/>

      <rect x="398" y="46" width="266" height="106" rx="14"/>
      <text class="t" x="531" y="74" text-anchor="middle">GemmaDecoderLayer × 18</text>

      <text class="m" x="531" y="134" text-anchor="middle">每层 2 个 RMSNorm（无 post-FFN norm）</text></g>
    <path class="edge" d="M664,99 L700,99"/>

    <g class="node dim" data-tip="GemmaModel.norm（:368, :424）&#10;最后一层之后、lm_head 之前的最终 RMSNorm&#10;eps=1e-6；权重形式 (1+weight)（:76）。">
      <rect x="700" y="66" width="146" height="66" rx="12"/>
      <text class="t" x="773" y="92" text-anchor="middle">最终 RMSNorm</text>
      <text class="m" x="773" y="112" text-anchor="middle">GemmaRMSNorm eps1e-6</text></g>
    <path class="edge" d="M846,99 L882,99"/>

    <g class="node dim" data-tip="lm_head（:442）Linear(2048→256000, bias=False)&#10;权重与 embed_tokens 共享（tied）&#10;_tied_weights_keys={lm_head.weight: model.embed_tokens.weight}（:433）&#10;vocab：config=256000 / 论文 Table 1=256128。">
      <rect x="882" y="52" width="166" height="94" rx="12"/>

      <text class="s" x="965" y="116" text-anchor="middle">与输入嵌入权重共享</text>
      <text class="s" x="965" y="134" text-anchor="middle">(b,s,256000) logits</text></g>
    <path class="edge" d="M1048,99 L1086,99"/>

    <g class="node core"><rect x="1086" y="66" width="126" height="66" rx="12"/>
      <text class="t" x="1149" y="92" text-anchor="middle">下一 token</text>
      <text class="s" x="1149" y="112" text-anchor="middle">softmax 取 argmax</text></g>

    <text class="lbl" x="269" y="176" text-anchor="middle">Gemma 嵌入前向乘 √d_model（:60/:363），LLaMA 不乘</text>
    <text class="lbl" x="965" y="176" text-anchor="middle">无最终二次归一化、无 soft-capping</text>
  </svg></body></html>
