<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#23272f; --sub:#66707b; --line:#e5e4df;
    --accent:#be185d; --accent-ink:#9d174d; --accent-soft:#fae4ee; --accent-line:#f0c4d7;
    --moe:#6d28d9; --moe-ink:#5b21b6; --moe-soft:#ede9fe; --moe-line:#ddd0f7;
    --node:#fffdfb; --edge:#c9c4ba; --mono:#9d174d;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; line-height:1.65; font-size:15px;}
  .wrap{max-width:1220px; margin:0 auto; padding:0 16px;}
  code,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; font-size:.92em;}
  .num{color:var(--mono); background:var(--accent-soft); padding:0 4px; border-radius:4px; white-space:nowrap;}
  .num.moe{color:var(--moe-ink); background:var(--moe-soft);}
  sup.src{color:var(--accent-ink); font-size:.72em; font-weight:700; cursor:help; white-space:nowrap;}
  a{color:var(--accent-ink);}

  nav.top{position:sticky; top:0; z-index:50; background:rgba(250,249,246,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  nav.top .wrap{display:flex; align-items:center; gap:14px; padding-top:10px; padding-bottom:10px; overflow-x:auto; white-space:nowrap;}
  nav.top .brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--accent-ink);}
  nav.top .brand svg{flex:none;}
  nav.top a.link{color:var(--ink); text-decoration:none; font-size:.9rem; padding:6px 10px; border-radius:8px;}
  nav.top a.link:hover{background:var(--accent-soft); color:var(--accent-ink);}
  nav.top a.link.moe-link{color:var(--moe-ink);}
  nav.top a.link.moe-link:hover{background:var(--moe-soft);}

  header.hero{padding:36px 0 8px;}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .badge{font-size:.78rem; padding:3px 10px; border-radius:999px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-ink);}
  .badge.moe{background:var(--moe-soft); border-color:var(--moe-line); color:var(--moe-ink);}
  h1{font-size:clamp(1.6rem,4vw,2.3rem); letter-spacing:.5px;}
  .lead{color:var(--sub); max-width:1000px; margin-top:8px;}
  .lead b{color:var(--ink);}

  section{margin:36px 0;}
  h2{font-size:1.35rem; display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  h2 .secno{font-size:.85rem; color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent-line); width:28px; height:28px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  h2.moe .secno{color:var(--moe-ink); background:var(--moe-soft); border-color:var(--moe-line);}
  h3{font-size:1.02rem; margin:12px 0 6px;}
  .note{font-size:.85rem; color:var(--sub);}
  .tip{font-size:.82rem; color:var(--sub); background:var(--accent-soft); border:1px dashed var(--accent-line); padding:8px 12px; border-radius:10px; margin-top:8px;}
  .tip.moe{background:var(--moe-soft); border-color:var(--moe-line); color:var(--moe-ink);}

  .diagram-shell{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; overflow-x:auto;}
  .diagram-shell svg{display:block; min-width:900px; width:100%; height:auto;}
  .dg{font-family:system-ui,"Microsoft YaHei",sans-serif;}
  .dg .node rect{fill:var(--node); stroke:var(--edge); stroke-width:1.3;}
  .dg .node.dim rect{fill:var(--accent-soft); stroke:var(--accent-line);}
  .dg .node.core rect{fill:#fdeef5; stroke:var(--accent); stroke-width:1.6;}
  .dg .node.moe rect{fill:var(--moe-soft); stroke:var(--moe); stroke-width:1.6;}
  .dg .node.mm rect{fill:#f4f4f2; stroke:var(--edge); stroke-dasharray:4 3;}
  .dg .node text{font-size:12.5px; fill:var(--ink);}
  .dg .node text.t{font-weight:700; font-size:13px;}
  .dg .node text.s{fill:var(--sub); font-size:11px;}
  .dg .node text.m{fill:var(--mono); font-family:ui-monospace,Consolas,monospace; font-size:11px;}
  .dg .node.moe text.m{fill:var(--moe-ink);}
  .dg .node.moe text.t{fill:var(--moe-ink);}
  .dg .edge{stroke:var(--edge); stroke-width:1.6; fill:none; marker-end:url(#arr);}
  .dg .edge.mm{stroke:#b9b3a8; stroke-dasharray:5 4;}
  .dg .edge.moe{stroke:var(--moe); stroke-width:1.8; marker-end:url(#arrm);}
  .dg .edge.faint{stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 4;}
  .dg .node.core circle{fill:#fdeef5; stroke:var(--accent); stroke-width:1.5;}
  .dg .node.core circle + text, .dg .g-circle-text{fill:var(--accent-ink); font-weight:700;}
  .dg .node.moe circle{fill:var(--moe-soft); stroke:var(--moe); stroke-width:1.5;}
  .dg .node.moe circle + text{fill:var(--moe-ink); font-weight:700;}
  .dg .lg{font-size:11px; fill:var(--sub);}
  .dg .lgb{font-size:11.5px; fill:var(--accent-ink); font-weight:600;}
  .dg .lgm{font-size:11.5px; fill:var(--moe-ink); font-weight:600;}

  table.cmp{width:100%; min-width:860px; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; table-layout:fixed;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.cmp th,table.cmp td{padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:.8rem; word-wrap:break-word;}
  table.cmp thead th{background:var(--accent-soft); color:var(--accent-ink); font-weight:700; font-size:.84rem;}
  table.cmp thead th.moe-th{background:var(--moe-soft); color:var(--moe-ink);}
  table.cmp tbody tr:nth-child(even){background:#fdf8fa;}
  table.cmp td.k{font-weight:600;}
  table.cmp td small{color:var(--sub); display:block; margin-top:2px;}
  table.cmp td.moe-td{background:var(--moe-soft);}
  table.cmp col.c1{width:16%;}
  table.cmp col.cx{width:16.8%;}
  table.cmp tr.hl td{background:#fdf3f7;}

  .cards{display:grid; grid-template-columns:1fr; gap:14px;}
  @media (min-width:820px){.cards{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .card.moe{background:var(--moe-soft); border-color:var(--moe-line);}
  .card h3{display:flex; align-items:center; gap:8px; margin-top:0; font-size:.98rem;}
  .card.moe h3{color:var(--moe-ink);}
  .card p{font-size:.88rem; margin-top:6px;}
  .card .meta{margin-top:8px; font-size:.78rem; color:var(--sub);}
  .formula{background:#2b2229; color:#f9c3db; font-family:ui-monospace,Consolas,monospace; font-size:.82rem; padding:10px 14px; border-radius:8px; margin-top:8px; overflow-x:auto; white-space:pre; line-height:1.6;}
  .formula.moe{background:#241d3a; color:#d8cbf8;}
  .formula .cm{color:#8b93a7;}

  ol.src{list-style:none; counter-reset:s; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  ol.src li{counter-increment:s; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.86rem;}
  ol.src li:last-child{border-bottom:none;}
  ol.src li::before{content:"[" counter(s) "] "; color:var(--accent-ink); font-weight:700; font-family:ui-monospace,Consolas,monospace;}
  ol.src .u{display:block; color:var(--sub); word-break:break-all; font-size:.78rem;}

  footer{margin:44px 0 24px; color:var(--sub); font-size:.8rem; text-align:center;}
  #tip{position:fixed; z-index:99; display:none; max-width:360px; background:#23272f; color:#fff; padding:10px 12px; border-radius:10px; font-size:.82rem; line-height:1.5; white-space:pre-line; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  #tip b{color:#f9c3db;}
  #tip b.m{color:#d8cbf8;}

  @media print{
    nav.top{display:none;}
    body{background:#fff; font-size:12px;}
    .diagram-shell{overflow:visible; border:none; padding:0;}
    .diagram-shell svg{min-width:0;}
    section{page-break-inside:avoid;}
    .cards{display:block;}
    .card{margin-bottom:10px;}
  }
</style></head><body style="margin:0;padding:0;background:#ffffff;"><svg viewBox="0 0 1240 780" class="dg" role="img">
    <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9c4ba"/></marker>
    <marker id="arrm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6d28d9"/></marker></defs>

    <!-- 输入 -->
    <g class="node core"><rect x="20" y="250" width="110" height="70" rx="12"/>
      <text class="t" x="75" y="280" text-anchor="middle">输入 x</text>
      <text class="m" x="75" y="300" text-anchor="middle">[B,T,2816]</text></g>

    <!-- 注意力子层：input_LN → attn → post_attn_LN → ⊕①（与 dense 相同） -->
    <text class="lgb" x="180" y="142">注意力子层（1386-1397）</text>
    <g class="node dim"><rect x="180" y="150" width="180" height="34" rx="8"/>
      <text class="s" x="270" y="172" text-anchor="middle">input_layernorm</text></g>
    <g class="node"><rect x="180" y="200" width="300" height="110" rx="10"/>
      <text class="t" x="330" y="224" text-anchor="middle">Self-Attention（QKV Norm）</text>
      <text class="m" x="330" y="244" text-anchor="middle">sliding 层：16Q×256 · 8KV×256</text>
      <text class="m" x="330" y="262" text-anchor="middle">full 层：16Q×512 · 2KV×512</text>
      <text class="m" x="330" y="280" text-anchor="middle">full 层 K=V 绑定 · RoPE 双配置</text></g>
    <g class="node dim"><rect x="520" y="215" width="180" height="34" rx="8"/>
      <text class="s" x="610" y="237" text-anchor="middle">post_attention_layernorm</text></g>
    <g class="node core"><circle cx="760" cy="232" r="16" data-tip="残差 ⊕①：residual=x；hidden=x+post_attn_LN(attn)&#10;来源：modeling_gemma4.py:1384, 1396-1397"/>
      <text class="s" x="760" y="236" text-anchor="middle" font-size="12">+</text></g>

    <!-- 注意力子层连线 -->
    <path class="edge" d="M130,285 L155,285 L155,167 L180,167"/>
    <path class="edge" d="M270,184 L270,192 L330,192 L330,200"/>
    <path class="edge" d="M480,255 L520,232"/>
    <path class="edge" d="M700,232 L744,232"/>
    <path class="edge faint" d="M75,320 L75,352 L744,352 L744,248"/>

    <!-- ⊕① 输出 = 新残差 h1（1399）：总线 y=360，从右侧下分叉，避免横穿分支框 -->
    <path class="edge" d="M776,232 L812,232 L812,360"/>
    <text class="lg" x="824" y="354">h1 = ⊕① 输出（新残差，MLP 之前）</text>

    <!-- 分支 A：dense MLP 路径（1400-1401, 1404） -->
    <g class="node dim"><rect x="150" y="380" width="200" height="34" rx="8"/>
      <text class="s" x="250" y="402" text-anchor="middle">pre_feedforward_layernorm</text></g>
    <g class="node"><rect x="150" y="430" width="250" height="80" rx="10"/>
      <text class="t" x="275" y="454" text-anchor="middle">dense MLP（GeGLU）</text>
      <text class="m" x="275" y="474" text-anchor="middle">2816 → 2112 → 2816</text>
      <text class="m" x="275" y="492" text-anchor="middle">gate×GELU ⊙ up → down</text></g>
    <g class="node dim"><rect x="150" y="524" width="200" height="34" rx="8"/>
      <text class="s" x="250" y="546" text-anchor="middle">post_ffn_layernorm_1</text></g>
    <path class="edge" d="M812,360 L250,360 L250,380"/>
    <path class="edge" d="M250,414 L250,422 L275,422 L275,430"/>
    <path class="edge" d="M275,510 L275,518 L250,518 L250,524"/>
    <!-- dense 输出绕下侧汇入内部 ⊕A -->
    <path class="edge" d="M350,541 L380,541 L380,704 L802,704 L802,488"/>

    <!-- 分支 B：router + experts（1407-1412） -->
    <g class="node moe"><rect x="460" y="372" width="300" height="88" rx="10"/>
      <text class="t" x="610" y="396" text-anchor="middle">Router（Gemma4TextRouter）</text>
      <text class="m" x="610" y="418" text-anchor="middle">RMSNorm × scale×h^-0.5 → Linear→E</text>
      <text class="m" x="610" y="436" text-anchor="middle">fp32 softmax → top-k → 归一化</text>
      <text class="m" x="610" y="454" text-anchor="middle">× per_expert_scale；输出 weights/index</text></g>
    <g class="node moe"><rect x="460" y="478" width="180" height="32" rx="8"/>
      <text class="s" x="550" y="498" text-anchor="middle">pre_feedforward_layernorm_2</text></g>
    <g class="node moe"><rect x="460" y="524" width="300" height="124" rx="10"/>
      <text class="t" x="610" y="548" text-anchor="middle">Experts（Gemma4TextExperts）</text>
      <text class="m" x="610" y="570" text-anchor="middle">128 专家 · 每专家 FFN 中间维 704</text>
      <text class="m" x="610" y="590" text-anchor="middle">gate_up [128,1408,2816] · down [128,2816,704]</text>
      <text class="m" x="610" y="610" text-anchor="middle">每 token 命中 top-k 专家 GeGLU</text>
      <text class="s" x="610" y="634" text-anchor="middle">hidden←pre_LN_2；权重←router；index_add 求和</text></g>
    <g class="node moe"><rect x="460" y="660" width="180" height="32" rx="8"/>
      <text class="s" x="550" y="680" text-anchor="middle">post_ffn_layernorm_2</text></g>

    <!-- 分支 B 连线：router 消费残差 hidden（灰线）；紫色线为门控权重 -->
    <path class="edge" d="M812,360 L812,416 L760,416"/>
    <path class="edge" d="M812,360 L812,494 L640,494"/>
    <path class="edge moe" d="M610,460 L610,524"/>
    <path class="edge" d="M550,510 L550,524"/>
    <path class="edge" d="M610,648 L610,654 L550,654 L550,660"/>
    <path class="edge" d="M640,676 L880,676 L880,488 L838,488"/>

    <!-- 内部合并 ⊕（1415）→ post_feedforward_LN（1417）→ 外层残差 ⊕（1418）→ ×scalar -->
    <g class="node moe"><circle cx="820" cy="470" r="18" data-tip="内部合并 ⊕：hidden = post_ffn_LN_1(dense MLP 输出) + post_ffn_LN_2(experts 输出)&#10;来源：modeling_gemma4.py:1404, 1412, 1415"/>
      <text class="s" x="820" y="474" text-anchor="middle" font-size="12">+</text></g>
    <g class="node dim"><rect x="870" y="453" width="190" height="34" rx="8"/>
      <text class="s" x="965" y="475" text-anchor="middle">post_feedforward_layernorm</text></g>
    <g class="node core"><circle cx="1100" cy="470" r="16" data-tip="外层残差 ⊕：residual = ⊕① 输出；hidden = residual + post_ffn_LN(合并结果)&#10;来源：modeling_gemma4.py:1399, 1417-1418"/>
      <text class="s" x="1100" y="474" text-anchor="middle" font-size="12">+</text></g>
    <g class="node core"><rect x="1138" y="435" width="92" height="70" rx="12"/>
      <text class="t" x="1184" y="464" text-anchor="middle">输出 y</text>
      <text class="m" x="1184" y="486" text-anchor="middle">× layer_scalar</text></g>

    <path class="edge" d="M838,470 L870,470"/>
    <path class="edge" d="M1060,470 L1084,470"/>
    <path class="edge" d="M1116,470 L1138,470"/>
    <!-- 外层残差旁路：⊕① 输出 → 外层 ⊕ 顶部 -->
    <path class="edge faint" d="M812,360 L1084,360 L1084,454"/>

    <text class="lg" x="150" y="734">注：源码无 shared expert；dense MLP（1401）与 router+experts（1410）为两条并行路径。</text>
    <text class="lg" x="150" y="754">注：128 专家 / top-k / 704 等具体数值来自 checkpoint 配置，本地 modeling 源码未硬编码，标注“未经源码验证”。</text>
  </svg></body></html>
