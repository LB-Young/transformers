<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#23272f; --sub:#5c6672; --line:#e5e4df;
    --accent:#7c3aed; --accent-ink:#5b21b6; --accent-soft:#ede4fc; --accent-line:#d5c5f6;
    --teal:#0f766e; --teal-soft:#d7efec; --teal-line:#9ad4cd;
    --amber:#b45309; --amber-soft:#fdeccd; --amber-line:#f2cf8f;
    --node:#fffdf9; --edge:#b9b4a9; --mono:#6d28d9;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#ffffff; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;}
  .dg{font-family:system-ui,"Microsoft YaHei",sans-serif;}
  .dg .node rect{fill:var(--node); stroke:var(--edge); stroke-width:1.3;}
  .dg .node.dim rect{fill:var(--accent-soft); stroke:var(--accent-line);}
  .dg .node.core rect{fill:#f3ecfd; stroke:var(--accent); stroke-width:1.7;}
  .dg .node.teal rect{fill:var(--teal-soft); stroke:var(--teal-line);}
  .dg .node.amber rect{fill:var(--amber-soft); stroke:var(--amber-line);}
  .dg .node text{font-size:12.5px; fill:var(--ink);}
  .dg .node text.t{font-weight:700; font-size:13px;}
  .dg .node text.s{fill:var(--sub); font-size:11px;}
  .dg .node text.m{fill:var(--mono); font-family:ui-monospace,Consolas,monospace; font-size:10.8px;}
  .dg .edge{stroke:var(--edge); stroke-width:1.6; fill:none; marker-end:url(#arr);}
  .dg .edge.dash{stroke-dasharray:5 4;}
  .dg .edge.teal{stroke:var(--teal); marker-end:url(#arrT);}
  .dg .edge.amber{stroke:var(--amber); marker-end:url(#arrA);}
  .dg text.lg{font-size:11px; fill:var(--sub);}
  .dg text.lgt{font-size:11px; fill:var(--teal); font-weight:600;}
  .dg text.lga{font-size:11px; fill:var(--amber); font-weight:600;}
</style></head><body style="margin:0;padding:0;background:#ffffff;"><svg viewBox="0 0 1340 820" class="dg" role="img">
    <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b9b4a9"/></marker>
      <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f766e"/></marker>
      <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker>
    </defs>

    <!-- 顶部口径横幅 -->
    <text x="20" y="34" font-size="13" font-weight="700" fill="#5b21b6">GLM-5 家族端到端数据流（多模态路径以本地 glm5_next 源码 = GLM-5.3-Flash 落地实现为准）</text>
    <text x="20" y="56" class="lg">上下文：GLM-5 = 202,752 tokens（glm5.ai 口径 202,000）；GLM-5.2 / GLM-5.3-Flash = 1,048,576（1M）· 词表 154880</text>

    <!-- 左列三路输入 -->
    <g class="node teal" data-tip="图像输入 pixel_values&#10;336×336 归一化图像&#10;送入 Glm5NextVisionModel&#10;来源：cfg-S:243（image_size 336 / patch 14）">
      <rect x="20" y="110" width="128" height="58" rx="10"/>
      <text class="t" x="84" y="134" text-anchor="middle">图像像素</text>
      <text class="s" x="84" y="152" text-anchor="middle">pixel_values</text>
    </g>
    <g class="node teal" data-tip="视频输入 pixel_values（视频帧序列）&#10;temporal_patch_size=2 时间维打包&#10;送入同一视觉塔&#10;来源：cfg-S:243（temporal_patch_size 2）">
      <rect x="20" y="200" width="128" height="58" rx="10"/>
      <text class="t" x="84" y="224" text-anchor="middle">视频帧序列</text>
      <text class="s" x="84" y="242" text-anchor="middle">pixel_values</text>
    </g>
    <g class="node core" data-tip="文本输入 input_ids&#10;序列中含 image_token(154854)/video_token(154855) 占位位&#10;先经 embed_tokens 查表得基础嵌入&#10;来源：cfg-S:299-304；mdl-S:2145">
      <rect x="20" y="430" width="128" height="60" rx="12"/>
      <text class="t" x="84" y="456" text-anchor="middle">文本 token</text>
      <text class="s" x="84" y="474" text-anchor="middle">input_ids</text>
    </g>
    <path class="edge teal" d="M148,139 L200,150"/>
    <path class="edge teal" d="M148,229 L200,215"/>

    <!-- 视觉塔 -->
    <g class="node teal" data-tip="Glm5NextVisionModel（视觉编码器）&#10;Conv3d patch embed：patch 14×14 / image 336 / temporal 2&#10;24 层 · hidden 1024 · 16 头 · axial 2D RoPE&#10;spatial_merge_size=2 → out_proj 1024→1536&#10;约 (336/14)²/2² ≈ 144 个视觉 soft token/图&#10;来源：cfg-S:241-243；mdl-S:1725-1799">
      <rect x="200" y="90" width="270" height="180" rx="12"/>
      <text class="t" x="335" y="116" text-anchor="middle">Glm5NextVisionModel</text>
      <text class="m" x="335" y="140" text-anchor="middle">Conv3d patch embed · patch 14 / 336px</text>
      <text class="m" x="335" y="160" text-anchor="middle">24 层 · hidden 1024 · 16 头</text>
      <text class="s" x="335" y="182" text-anchor="middle">spatial_merge 2 · temporal_patch 2</text>
      <text class="s" x="335" y="202" text-anchor="middle">out_proj 1024 → 1536</text>
      <text class="s" x="335" y="222" text-anchor="middle">≈144 个视觉 soft token / 图</text>
      <text class="s" x="335" y="246" text-anchor="middle">axial 2D RoPE（视觉侧）</text>
    </g>

    <!-- 文本嵌入 -->
    <g class="node dim" data-tip="输入嵌入 embed_tokens&#10;Embedding(154880, 4096)&#10;tie_word_embeddings=False（不绑定 LM Head）&#10;来源：cfg-S:100-101,130">
      <rect x="560" y="430" width="150" height="80" rx="12"/>
      <text class="t" x="635" y="458" text-anchor="middle">Embedding</text>
      <text class="m" x="635" y="478" text-anchor="middle">154880 × 4096</text>
      <text class="s" x="635" y="496" text-anchor="middle">tie = False</text>
    </g>
    <path class="edge" d="M148,460 C340,460 460,465 560,468"/>
    <text class="lg" x="300" y="448" text-anchor="start">input_ids → embed_tokens</text>

    <!-- 序列融合 -->
    <g class="node dim" data-tip="序列融合（masked_scatter）&#10;视觉/视频 soft 特征（1536→4096 投影后）&#10;按占位 token 位覆盖基础词表嵌入：&#10;image_token_id=154854 · video_token_id=154855&#10;image/video start-end = 154830-154833&#10;合并为统一 [B,T,4096] 进文本主干&#10;来源：cfg-S:290,299-304；mdl-S:1888-1891">
      <rect x="760" y="420" width="140" height="100" rx="12"/>
      <text class="t" x="830" y="448" text-anchor="middle">序列融合</text>
      <text class="s" x="830" y="468" text-anchor="middle">masked_scatter</text>
      <text class="m" x="830" y="488" text-anchor="middle">img 154854 / vid 154855</text>
      <text class="s" x="830" y="508" text-anchor="middle">统一 [B,T,4096]</text>
    </g>
    <path class="edge teal" d="M470,200 C560,200 640,380 760,445"/>
    <path class="edge" d="M710,470 L760,470"/>

    <!-- 文本主干解码栈 -->
    <g class="node core" data-tip="Glm5NextTextModel 解码层 × 45&#10;= GLM-5.3-Flash 架构的 transformers 落地实现&#10;（注意：不是 GLM-5 本体）&#10;hidden 4096 · mHC 4 流残差贯穿 · 文本 NoPE&#10;每层双注意力分支按 idx 分流，详见图 02&#10;来源：cfg-S:101,105,147,164-169">
      <rect x="960" y="110" width="350" height="560" rx="14"/>
      <text class="t" x="1135" y="138" text-anchor="middle">Glm5NextTextModel 解码层 × 45</text>
      <text class="s" x="1135" y="158" text-anchor="middle">= GLM-5.3-Flash 落地实现（glm5_next 源码）</text>

      <g class="node dim" data-tip="注意力双分支（运行时按 idx%4 分流）&#10;idx%4==3 → DSA 稀疏注意力（11 层）&#10;idx%4!=3 → KDA 线性注意力（34 层）&#10;MLA 压缩 KV：q_lora_rank 1536 / kv_lora_rank 512&#10;qk_rope_head_dim=0：文本侧 NoPE&#10;来源：cfg-S:112-116,164-169；mdl-S:1318-1335">
        <rect x="980" y="180" width="310" height="150" rx="10"/>
        <text class="t" x="1135" y="206" text-anchor="middle">注意力双分支</text>
        <rect x="996" y="222" width="9" height="13" rx="2" fill="#d7efec" stroke="#0f766e"/>
        <text class="lgt" x="1012" y="233" text-anchor="start">idx%4==3 → DSA 稀疏注意力 ×11</text>
        <rect x="996" y="244" width="9" height="13" rx="2" fill="#fdeccd" stroke="#b45309"/>
        <text class="lga" x="1012" y="255" text-anchor="start">idx%4!=3 → KDA 线性注意力 ×34</text>
        <text class="m" x="1135" y="282" text-anchor="middle">MLA：q_lora 1536 · kv_lora 512</text>
        <text class="s" x="1135" y="302" text-anchor="middle">文本 NoPE（qk_rope_head_dim=0）</text>
        <text class="s" x="1135" y="320" text-anchor="middle">mHC 4 流残差贯穿（HyperConnection）</text>
      </g>

      <g class="node dim" data-tip="FFN 子层：前 3 层 dense / 后 42 层 MoE&#10;mlp_layer_types 默认 [dense]×3 + [sparse]×42&#10;MoE：288 路由专家 top-8 + 1 共享专家&#10;moe_intermediate=2048 · sigmoid 路由 ×2.5&#10;来源：cfg-S:103,109,119,159-162；mdl-S:144-206">
        <rect x="980" y="350" width="310" height="110" rx="10"/>
        <text class="t" x="1135" y="376" text-anchor="middle">FFN 子层</text>
        <text class="s" x="1135" y="398" text-anchor="middle">前 3 层 dense MLP</text>
        <text class="s" x="1135" y="418" text-anchor="middle">后 42 层 MoE：288 路由专家 top-8</text>
        <text class="m" x="1135" y="438" text-anchor="middle">+1 共享专家 · norm_topk · ×2.5</text>
      </g>

      <g class="node amber" data-tip="GLM-5 本体对照（技术报告 arXiv:2602.15763）&#10;GLM-5 以文本 / Agentic 为主线，报告无多模态章节&#10;744B/40B · 78 层（3 dense+75 MoE）· hidden 6144&#10;256 专家 top-8 + 1 共享 · MLA 基座（Q LoRA 2048 / KV LoRA 512）&#10;DSA 稀疏注意力（k=2048）+ MTP；202,752 上下文&#10;官网营销口径 745B/44B/5.9% sparsity 为差异口径">
        <rect x="980" y="480" width="310" height="170" rx="10"/>
        <text class="t" x="1135" y="506" text-anchor="middle">GLM-5 本体对照（技术报告）</text>
        <text class="s" x="1135" y="528" text-anchor="middle">744B/40B · 78 层 · hidden 6144</text>
        <text class="s" x="1135" y="548" text-anchor="middle">256 专家 top-8 + 1 共享</text>
        <text class="s" x="1135" y="568" text-anchor="middle">MLA base：Q LoRA 2048 / KV LoRA 512</text>
        <text class="s" x="1135" y="588" text-anchor="middle">DSA（k=2048）+ MTP · 202,752</text>
        <text class="s" x="1135" y="612" text-anchor="middle">报告无多模态章节；文本 API 输入=文本</text>
        <text class="s" x="1135" y="632" text-anchor="middle">「统一处理图像/文档/文本」为官网营销口径</text>
      </g>
    </g>
    <path class="edge" d="M900,470 L960,470"/>

    <!-- 输出 -->
    <g class="node dim" data-tip="HyperHead 4 流求均值 → 最终 RMSNorm&#10;Glm5NextTextHyperHead：mHC 4 流 mean 折叠&#10;在最终 norm 前调用（mdl-S:1510, 332-336）&#10;来源：mdl-S:218-336">
      <rect x="960" y="710" width="180" height="60" rx="12"/>
      <text class="t" x="1050" y="736" text-anchor="middle">HyperHead → RMSNorm</text>
      <text class="s" x="1050" y="756" text-anchor="middle">4 流 mean 折叠</text>
    </g>
    <path class="edge" d="M1135,670 L1135,710"/>
    <g class="node dim" data-tip="LM Head（主输出，无文本专用 ForCausalLM 类）&#10;4096 → 154880 logits&#10;来源：mdl-S:2150,2258">
      <rect x="1180" y="710" width="90" height="60" rx="12"/>
      <text class="t" x="1225" y="736" text-anchor="middle">LM Head</text>
      <text class="m" x="1225" y="756" text-anchor="middle">→154880</text>
    </g>
    <path class="edge" d="M1140,740 L1180,740"/>
    <text class="lg" x="1180" y="792">下一 token 分布</text>

    <!-- MTP 说明 -->
    <g class="node amber" data-tip="MTP（多 token 预测）&#10;技术报告：训练参数共享 3 个 MTP 层 / 部署 1 层&#10;接受长度 2.76 vs DeepSeek-V3.2 的 2.55&#10;⚠ transformers glm5_next 模块未实现 MTP：&#10;_keys_to_ignore_on_load_unexpected 显式忽略&#10;layers.45.* 与 layers.*.shared_head.* 权重（mdl-S:1379）&#10;checkpoint 中 MTP 权重被跳过，主输出仅 lm_head">
      <rect x="20" y="640" width="880" height="130" rx="12"/>
      <text class="t" x="460" y="668" text-anchor="middle">MTP（多 token 预测）——训练侧 3 层共享 / 部署 1 层</text>
      <text class="s" x="460" y="692" text-anchor="middle">接受长度 2.76 vs DeepSeek-V3.2 的 2.55（同 4 步投机）；GLM-5.2 进一步 +20%（消融 4.56 → 5.47）</text>
      <text class="m" x="460" y="716" text-anchor="middle">⚠ transformers 未实现 MTP：mdl-S:1379 显式忽略 layers.45. / shared_head 权重，主输出仅 lm_head（mdl-S:2150,2258）</text>
      <text class="s" x="460" y="740" text-anchor="middle">Glm5NextForConditionalGeneration 为唯一多模态入口（mdl-S:2135），无文本专用 ForCausalLM 类</text>
    </g>
  </svg></body></html>
